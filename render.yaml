services:
  - type: web
    name: commuter-tea-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/locale/detect
    envVars:
      - key: SERVER_PORT
        value: 8090
      - key: STORAGE_TYPE
        value: r2
      - key: DATABASE_URL
        fromDatabase:
          name: commuter-tea-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: commuter-tea-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: commuter-tea-db
          property: password
      - key: H2_CONSOLE
        value: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: commuter-tea-db
    plan: free
    databaseName: commuter_tea
    user: commuter_tea
