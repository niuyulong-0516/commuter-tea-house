<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通勤茶馆 · 管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #263238; font-size: 14px; }
    button, input, textarea { font-family: inherit; font-size: inherit; }
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 360px; padding: 36px; border-radius: 16px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    .login-card h1 { margin-bottom: 8px; font-size: 22px; text-align: center; }
    .login-card .sub { margin-bottom: 28px; color: #90a4ae; text-align: center; font-size: 13px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 6px; color: #607d8b; font-size: 13px; }
    .field input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #dde3e8; border-radius: 8px; outline: none; }
    .field input:focus { border-color: #2f6b4f; }
    .btn { height: 42px; padding: 0 20px; border: 0; border-radius: 8px; background: #2f6b4f; color: #fff; cursor: pointer; }
    .btn:hover { background: #285c43; }
    .btn.full { width: 100%; }
    .btn.danger { background: #c05b4a; }
    .btn.ghost { background: #eef2f4; color: #455a64; }
    .err { min-height: 20px; margin-bottom: 8px; color: #c05b4a; font-size: 13px; }

    .app { display: none; min-height: 100vh; }
    .app.show { display: block; }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e8edf0; }
    .topbar h1 { font-size: 17px; }
    .topbar .user { color: #78909c; }
    .layout { display: flex; min-height: calc(100vh - 60px); }
    .side { width: 200px; padding: 20px 12px; background: #fff; border-right: 1px solid #e8edf0; }
    .nav-item { display: block; width: 100%; margin-bottom: 4px; padding: 11px 14px; border: 0; border-radius: 8px; background: transparent; color: #546e7a; text-align: left; cursor: pointer; }
    .nav-item:hover { background: #f3f6f8; }
    .nav-item.active { background: #e8f2ec; color: #2f6b4f; font-weight: 600; }
    .main { flex: 1; padding: 24px; overflow: auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel h2 { margin-bottom: 18px; font-size: 18px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat { padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.03); }
    .stat .num { font-size: 28px; font-weight: 700; color: #2f6b4f; }
    .stat .label { margin-top: 6px; color: #90a4ae; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.03); }
    th, td { padding: 12px 14px; border-bottom: 1px solid #eef2f4; text-align: left; vertical-align: top; }
    th { background: #fafbfc; color: #78909c; font-weight: 600; font-size: 13px; }
    td .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e8f2ec; color: #2f6b4f; font-size: 12px; }
    .tag.admin { background: #fff0e6; color: #b56b42; }
    .empty { padding: 40px; color: #90a4ae; text-align: center; }
    .agreement-card { max-width: 860px; padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.03); margin-bottom: 16px; }
    .agreement-card h3 { margin-bottom: 12px; }
    .agreement-card textarea { width: 100%; min-height: 320px; padding: 12px; border: 1px solid #dde3e8; border-radius: 8px; outline: none; line-height: 1.6; }
    .agreement-card textarea:focus { border-color: #2f6b4f; }
    .agreement-card .bar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; color: #90a4ae; font-size: 12px; }
    .toast { position: fixed; top: 20px; left: 50%; z-index: 99; padding: 10px 18px; border-radius: 8px; background: #263238; color: #fff; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div id="loginPage" class="login-wrap">
    <div class="login-card">
      <h1>通勤茶馆 · 管理后台</h1>
      <p class="sub">Admin Console</p>
      <div class="field"><label>用户名</label><input id="username" value="admin" autocomplete="username" /></div>
      <div class="field"><label>密码</label><input id="password" type="password" value="admin123456" autocomplete="current-password" /></div>
      <div id="loginErr" class="err"></div>
      <button class="btn full" onclick="login()">登录</button>
    </div>
  </div>

  <div id="app" class="app">
    <div class="topbar">
      <h1>通勤茶馆 · 管理后台</h1>
      <div class="user"><span id="adminName"></span> <button class="btn ghost" style="margin-left:12px;height:32px;padding:0 12px;" onclick="logout()">退出</button></div>
    </div>
    <div class="layout">
      <div class="side">
        <button class="nav-item active" data-panel="dashboard" onclick="switchPanel('dashboard', this)">概览</button>
        <button class="nav-item" data-panel="agreements" onclick="switchPanel('agreements', this)">协议管理</button>
        <button class="nav-item" data-panel="posts" onclick="switchPanel('posts', this)">帖子管理</button>
        <button class="nav-item" data-panel="feedbacks" onclick="switchPanel('feedbacks', this)">反馈管理</button>
        <button class="nav-item" data-panel="users" onclick="switchPanel('users', this)">用户管理</button>
      </div>
      <div class="main">
        <div id="panel-dashboard" class="panel active">
          <h2>概览</h2>
          <div class="cards">
            <div class="stat"><div class="num" id="statUsers">-</div><div class="label">用户数</div></div>
            <div class="stat"><div class="num" id="statPosts">-</div><div class="label">帖子数</div></div>
            <div class="stat"><div class="num" id="statComments">-</div><div class="label">评论数</div></div>
            <div class="stat"><div class="num" id="statFeedbacks">-</div><div class="label">反馈数</div></div>
          </div>
        </div>
        <div id="panel-agreements" class="panel">
          <h2>协议管理</h2>
          <div class="agreement-card">
            <h3>用户协议（terms）</h3>
            <textarea id="termsContent"></textarea>
            <div class="bar"><span id="termsUpdated"></span><button class="btn" onclick="saveAgreement('terms')">保存用户协议</button></div>
          </div>
          <div class="agreement-card">
            <h3>隐私协议（privacy）</h3>
            <textarea id="privacyContent"></textarea>
            <div class="bar"><span id="privacyUpdated"></span><button class="btn" onclick="saveAgreement('privacy')">保存隐私协议</button></div>
          </div>
        </div>
        <div id="panel-posts" class="panel">
          <h2>帖子管理</h2>
          <table><thead><tr><th>ID</th><th>内容</th><th>分类</th><th>出行</th><th>作者</th><th>浏览</th><th>时间</th><th>操作</th></tr></thead><tbody id="postsBody"></tbody></table>
        </div>
        <div id="panel-feedbacks" class="panel">
          <h2>反馈管理</h2>
          <table><thead><tr><th>ID</th><th>问题描述</th><th>截图</th><th>WhatsApp</th><th>用户ID</th><th>时间</th><th>操作</th></tr></thead><tbody id="feedbacksBody"></tbody></table>
        </div>
        <div id="panel-users" class="panel">
          <h2>用户管理</h2>
          <table><thead><tr><th>编号</th><th>用户名</th><th>昵称</th><th>角色</th><th>出行</th><th>注册时间</th></tr></thead><tbody id="usersBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('tea_admin_token') || ''
    const $ = (id) => document.getElementById(id)
    const esc = (v) => v == null ? '' : String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    const fmt = (v) => v ? new Date(v).toLocaleString('zh-CN', {hour12:false}) : '-'

    function toast(msg) {
      const el = $('toast'); el.textContent = msg; el.classList.add('show')
      setTimeout(() => el.classList.remove('show'), 2000)
    }

    async function api(url, options = {}) {
      options.headers = { 'Content-Type': 'application/json', 'X-Auth-Token': token, ...(options.headers || {}) }
      const res = await fetch(url, options)
      const text = await res.text()
      let data = null
      try { data = text ? JSON.parse(text) : null } catch (_) {}
      if (!res.ok) throw new Error(data && data.message ? data.message : ('请求失败 ' + res.status))
      return data
    }

    async function login() {
      $('loginErr').textContent = ''
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value, transportType: 'RAIL' }),
        })
        const text = await res.text(); let data = null
        try { data = text ? JSON.parse(text) : null } catch (_) {}
        if (!res.ok) throw new Error(data && data.message ? data.message : '登录失败')
        token = data.token || data.accessToken || ''
        localStorage.setItem('tea_admin_token', token)
        const me = await api('/api/auth/me')
        if (!me.role || me.role !== 'ADMIN') {
          localStorage.removeItem('tea_admin_token'); token = ''
          throw new Error('该账号不是管理员')
        }
        $('adminName').textContent = me.nickname || me.username
        $('loginPage').style.display = 'none'
        $('app').classList.add('show')
        loadDashboard()
      } catch (e) {
        $('loginErr').textContent = e.message
      }
    }

    function logout() {
      localStorage.removeItem('tea_admin_token'); token = ''
      $('app').classList.remove('show')
      $('loginPage').style.display = 'flex'
    }

    function switchPanel(name, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
      $('panel-' + name).classList.add('active')
      btn.classList.add('active')
      if (name === 'dashboard') loadDashboard()
      if (name === 'agreements') loadAgreements()
      if (name === 'posts') loadPosts()
      if (name === 'feedbacks') loadFeedbacks()
      if (name === 'users') loadUsers()
    }

    async function loadDashboard() {
      try {
        const d = await api('/api/admin/dashboard')
        $('statUsers').textContent = d.userCount
        $('statPosts').textContent = d.postCount
        $('statComments').textContent = d.commentCount
        $('statFeedbacks').textContent = d.feedbackCount
      } catch (e) { toast(e.message) }
    }

    async function loadAgreements() {
      try {
        for (const code of ['terms', 'privacy']) {
          const d = await api('/api/agreements/' + code)
          $(code + 'Content').value = d.content || ''
          $(code + 'Updated').textContent = '最近更新：' + fmt(d.updatedAt)
        }
      } catch (e) { toast(e.message) }
    }

    async function saveAgreement(code) {
      try {
        const d = await api('/api/agreements/' + code, { method: 'PUT', body: JSON.stringify({ content: $(code + 'Content').value }) })
        $(code + 'Updated').textContent = '最近更新：' + fmt(d.updatedAt)
        toast('保存成功')
      } catch (e) { toast(e.message) }
    }

    async function loadPosts() {
      try {
        const list = await api('/api/admin/posts')
        $('postsBody').innerHTML = list.length ? list.map(p => `
          <tr>
            <td>${p.id}</td>
            <td><div class="clamp">${esc(p.content)}</div></td>
            <td><span class="tag">${esc(p.category)}</span></td>
            <td>${esc(p.transportType)}</td>
            <td>${esc(p.authorName)}</td>
            <td>${p.viewCount}</td>
            <td>${fmt(p.createdAt)}</td>
            <td><button class="btn danger" style="height:30px;padding:0 10px;" onclick="removePost(${p.id})">删除</button></td>
          </tr>`).join('') : '<tr><td colspan="8" class="empty">暂无数据</td></tr>'
      } catch (e) { toast(e.message) }
    }

    async function removePost(id) {
      if (!confirm('确定删除这条帖子？')) return
      try { await api('/api/admin/posts/' + id, { method: 'DELETE' }); toast('已删除'); loadPosts() }
      catch (e) { toast(e.message) }
    }

    async function loadFeedbacks() {
      try {
        const list = await api('/api/admin/feedbacks')
        $('feedbacksBody').innerHTML = list.length ? list.map(f => `
          <tr>
            <td>${f.id}</td>
            <td><div class="clamp">${esc(f.description)}</div></td>
            <td>${(f.images || []).length ? (f.images || []).map((u,i)=>`<a href="${esc(u)}" target="_blank">图${i+1}</a>`).join(' ') : '-'}</td>
            <td>${esc(f.whatsapp) || '-'}</td>
            <td>${esc(f.userId)}</td>
            <td>${fmt(f.createdAt)}</td>
            <td><button class="btn danger" style="height:30px;padding:0 10px;" onclick="removeFeedback(${f.id})">删除</button></td>
          </tr>`).join('') : '<tr><td colspan="7" class="empty">暂无数据</td></tr>'
      } catch (e) { toast(e.message) }
    }

    async function removeFeedback(id) {
      if (!confirm('确定删除这条反馈？')) return
      try { await api('/api/admin/feedbacks/' + id, { method: 'DELETE' }); toast('已删除'); loadFeedbacks() }
      catch (e) { toast(e.message) }
    }

    async function loadUsers() {
      try {
        const list = await api('/api/admin/users')
        $('usersBody').innerHTML = list.length ? list.map(u => `
          <tr>
            <td>${esc(u.id)}</td>
            <td>${esc(u.username)}</td>
            <td>${esc(u.nickname) || '-'}</td>
            <td><span class="tag ${u.role === 'ADMIN' ? 'admin' : ''}">${esc(u.role)}</span></td>
            <td>${esc(u.transportType)}</td>
            <td>${fmt(u.createdAt)}</td>
          </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>'
      } catch (e) { toast(e.message) }
    }

    (async function init() {
      if (!token) return
      try {
        const me = await api('/api/auth/me')
        if (!me.role || me.role !== 'ADMIN') { localStorage.removeItem('tea_admin_token'); token = ''; return }
        $('adminName').textContent = me.nickname || me.username
        $('loginPage').style.display = 'none'
        $('app').classList.add('show')
        loadDashboard()
      } catch (e) { localStorage.removeItem('tea_admin_token'); token = '' }
    })()
  </script>
</body>
</html>
